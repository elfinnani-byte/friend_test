# 지정한 리비전으로 트래픽 100%를 되돌린다. 이미지를 다시 만들거나 배포하지 않고 트래픽만 옮긴다.
# 사용법: Actions 탭 > rollback > Run workflow 에서 환경과 리비전 이름을 넣는다.
#   리비전 이름은 deploy 실행의 "이전 리비전" 단계 로그에 남아 있다.
#   production 을 고르면 production 환경의 배포 승인을 거친다.
name: rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 되돌릴 환경
        type: choice
        options: [staging, production]
        required: true
      revision:
        description: 되돌릴 리비전 이름 (예 friend-agent-staging-00014-jbd)
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SERVICE: ${{ vars.SERVICE }}
      REGION: us-central1
      REVISION: ${{ inputs.revision }}
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - id: setup_gcloud
        uses: google-github-actions/setup-gcloud@v3

      # 다른 서비스의 리비전이나 없는 리비전을 넣었으면 트래픽을 건드리기 전에 멈춘다.
      - name: 리비전 확인
        id: check
        run: |
          case "$REVISION" in
            "$SERVICE"-*) ;;
            *) echo "::error::$REVISION 은 $SERVICE 서비스의 리비전 이름이 아닙니다."; exit 1 ;;
          esac
          gcloud run revisions describe "$REVISION" --region "$REGION" --format='value(metadata.name)'
          echo "되돌리기 전 트래픽:"
          gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.percent > 0) | "\(.revisionName)=\(.percent)"'

      - name: 되돌리기
        id: rollback
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-revisions "$REVISION=100"

      - name: 결과
        id: result
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.percent > 0) | "\(.revisionName)=\(.percent)"'

      # 성공이든 실패든 Slack 으로 결과를 보낸다. 웹훅 주소는 시크릿으로만 넘기고 출력하지 않는다.
      # 시크릿이 없거나 전송이 실패해도 알림만 건너뛰고 롤백 결과는 바꾸지 않는다.
      - name: Slack 알림
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TARGET_ENV: ${{ inputs.environment }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOMES: |
            auth=${{ steps.auth.outcome }}
            setup-gcloud=${{ steps.setup_gcloud.outcome }}
            리비전 확인=${{ steps.check.outcome }}
            되돌리기=${{ steps.rollback.outcome }}
            결과=${{ steps.result.outcome }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 시크릿이 없어 알림을 건너뜁니다."
            exit 0
          fi
          case "$JOB_STATUS" in
            success) HEAD="↩️ 롤백 완료" ;;
            cancelled) HEAD="❌ 롤백 취소" ;;
            *) HEAD="❌ 롤백 실패" ;;
          esac
          # 되돌린 리비전이 실제로 돌리는 커밋. 확인하지 못하면 이 워크플로를 실행한 커밋을 쓴다.
          COMMIT=$(gcloud run revisions describe "$REVISION" --region "$REGION" --format=json 2>/dev/null \
            | jq -r '.spec.containers[0].env[]? | select(.name == "COMMIT_SHA") | .value' || true)
          COMMIT=${COMMIT:-$GITHUB_SHA}
          TEXT="[friend-agent · $TARGET_ENV] $HEAD
          커밋: ${COMMIT::7}
          새 리비전: $REVISION"
          FAILED=$(printf '%s\n' "$OUTCOMES" | awk -F= '$2 == "failure" { print $1; exit }')
          if [ -n "$FAILED" ]; then TEXT="$TEXT
          실패한 단계: $FAILED"; fi
          TEXT="$TEXT
          실행: $RUN_URL"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST -H 'Content-Type: application/json' \
            --data "$(jq -n --arg text "$TEXT" '{text: $text}')" "$SLACK_WEBHOOK_URL" || true)
          if [ "$CODE" = "200" ]; then
            echo "Slack 알림을 보냈습니다."
          else
            echo "Slack 알림 전송에 실패했습니다(응답 코드 $CODE). 롤백 결과에는 영향이 없습니다."
          fi
